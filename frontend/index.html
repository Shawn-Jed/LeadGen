<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeadGen — Akquise-Cockpit Hamburg</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23201e19'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23fdf6ee' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- SVG grain filter -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-washes" aria-hidden="true">
    <span class="wash w1"></span>
    <span class="wash w2"></span>
    <span class="wash w3"></span>
    <span class="wash w4"></span>
  </div>

  <header class="topbar reveal" style="--d:0">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1>LeadGen</h1>
        <p>Akquise-Cockpit Hamburg</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="offline-badge" class="offline-badge" hidden>Demo-Daten</span>
      <span id="today" class="today"></span>
      <button id="btn-new-lead" class="btn btn-accent">
        <span class="plus" aria-hidden="true">+</span> Neuer Lead
      </button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Kennzahlen"></section>

  <nav class="tabs reveal" style="--d:2" role="tablist">
    <button class="tab is-active" data-view="pipeline" role="tab">Pipeline</button>
    <button class="tab" data-view="fokus" role="tab">Fokus</button>
    <button class="tab" data-view="discovery" role="tab">Discovery</button>
  </nav>

  <main>
    <section id="view-pipeline" class="view is-active">
      <div class="lead-search">
        <span class="lead-search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="lead-search" placeholder="Lead suchen — Name, Ort, Branche…" autocomplete="off" aria-label="Leads durchsuchen">
        <button type="button" class="lead-search-clear" id="lead-search-clear" hidden aria-label="Suche zurücksetzen">×</button>
      </div>
      <div class="tagbar" id="lead-tagbar" hidden></div>
      <div class="board" id="board"></div>
    </section>

    <section id="view-fokus" class="view">
      <div class="fokus-container" id="fokus-container"></div>
    </section>

    <section id="view-discovery" class="view">
      <div class="discovery-layout">
        <aside class="run-list" id="run-list" aria-label="Scan-Läufe"></aside>
        <div class="run-detail" id="run-detail"></div>
      </div>
    </section>
  </main>

  <!-- Drawer (Lead-Detail) -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Lead-Detail"></aside>

  <!-- Modal (Neuer Lead) -->
  <div class="modal-scrim" id="modal-scrim" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title">Neuer Lead</h2>
      <form id="new-lead-form" class="modal-form">
        <label class="field">
          <span>Firma</span>
          <input type="text" name="firma" required autocomplete="off" placeholder="z.B. Zahnarztpraxis Eppendorf" />
        </label>
        <div class="field">
          <span>Schwäche <span class="field-hint">mind. 1 Tag wählen</span></span>
          <div class="tag-picker" id="new-lead-tags"></div>
          <div class="tag-custom">
            <input type="text" id="new-lead-tag-custom" autocomplete="off" placeholder="+ eigener Tag" />
            <button type="button" class="btn btn-ghost btn-sm" id="new-lead-tag-add">Hinzufügen</button>
          </div>
        </div>
        <label class="field">
          <span>Notiz <span class="field-hint">optional — Freitext, warum angenommen, was verbesserbar</span></span>
          <textarea name="notiz" rows="3" autocomplete="off" placeholder="z.B. Google-Bewertungen stark, aber keine Website — guter Kandidat für Festpreis-Onepager"></textarea>
        </label>
        <p class="form-error" id="new-lead-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Abbrechen</button>
          <button type="submit" class="btn btn-accent">Anlegen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal (Discovery-Kandidat übernehmen) -->
  <div class="modal-scrim" id="ueber-scrim" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ueber-title">
      <h2 id="ueber-title" class="modal-title">Als Lead übernehmen</h2>
      <p class="modal-sub">Kandidat: <strong id="ueber-firma"></strong></p>
      <div class="modal-form">
        <label class="field">
          <span>Website URL <span class="field-hint">optional — falls vorhanden/gefunden</span></span>
          <input type="text" id="ueber-url" autocomplete="off" placeholder="https://…" />
        </label>
        <div class="field">
          <span>Schwäche <span class="field-hint">optional — Tags wählen, sonst automatisch aus Discovery-Befund</span></span>
          <div class="tag-picker" id="ueber-tags"></div>
          <div class="tag-custom">
            <input type="text" id="ueber-tag-custom" autocomplete="off" placeholder="+ eigener Tag" />
            <button type="button" class="btn btn-ghost btn-sm" id="ueber-tag-add">Hinzufügen</button>
          </div>
        </div>
        <label class="field">
          <span>Notiz <span class="field-hint">optional — warum übernommen, was verbesserbar</span></span>
          <textarea id="ueber-notiz" rows="3" autocomplete="off" placeholder="z.B. viele Google-Bewertungen, aber kein Web-Auftritt"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-ueber-close>Abbrechen</button>
          <button type="button" class="btn btn-accent" id="ueber-confirm">→ Lead anlegen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast host -->
  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
